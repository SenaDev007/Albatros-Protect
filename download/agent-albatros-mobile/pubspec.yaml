name: agent_albatros
description: >-
  Agent Albatros — application mobile du service béninois de recherche et de
  récupération d'appareils (pilote Cotonou). Client de l'API /api/v1.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Client HTTP vers l'API Agent Albatros (le base URL est configurable)
  http: ^1.2.2
  # Gestion d'état simple et idiomatoire
  provider: ^6.1.2
  # Sessions cookies (Set-Cookie de l'API /auth)
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  # Google Maps Platform — requis par la spécification pour la cartographie.
  # Clés : Android (manifest) / iOS (Info.plist), jamais côté code.
  # Si les clés ne sont pas configurées, l'app reste utilisable : la carte
  # bascule sur l'état honnête « aucune position disponible » (liste des observations).
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
